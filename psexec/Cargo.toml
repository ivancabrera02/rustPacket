[package]
name = "psexec"
version = "0.1.0"
edition = "2021"
description = "PSExec rust version"
[[bin]]
name = "psexec"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
panic = "unwind"

[dependencies]
hmac  = "0.12"
md-5  = "0.10"
sha2  = "0.10"
aes   = "0.8"
cmac  = "0.7"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Console",
] }
clap = { version = "4", features = ["derive"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
